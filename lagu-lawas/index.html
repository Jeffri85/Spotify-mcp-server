<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lagu Lawas</title>
<style>
:root{--bg:#1a1410;--card:#2a211a;--fg:#f4e9d8;--mute:#b9a68c;--acc:#e8a33d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,serif}
header{padding:28px 16px 12px;text-align:center}
h1{margin:0;color:var(--acc);font-size:2rem}
header p{color:var(--mute);margin:6px 0 0}
main{max-width:640px;margin:0 auto;padding:0 16px 120px}
input{width:100%;padding:12px 14px;margin:14px 0;border-radius:10px;border:1px solid #4a3b2d;background:var(--card);color:var(--fg);font-size:1rem}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
li.playing{outline:2px solid var(--acc)}
.no{width:24px;text-align:right;color:var(--mute);font-size:.85rem}
.info{flex:1;min-width:0}
.t{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mute);font-size:.85rem}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#1a1410;font-size:18px;cursor:pointer;flex:none}
.play:disabled{opacity:.5}
.sp{color:var(--mute);font-size:.75rem;text-decoration:none}
#bar{position:fixed;left:0;right:0;bottom:0;background:#120d09;border-top:1px solid #4a3b2d;padding:10px 16px;text-align:center;font-size:.9rem}
#bar progress{width:100%;height:6px;margin-top:6px}
</style>
</head>
<body>
<header><h1>🎵 Lagu Lawas</h1><p>Tembang kenangan — tekan ▶ untuk memutar cuplikan</p></header>
<main>
<input id="q" placeholder="Cari judul atau penyanyi…">
<ul id="list"></ul>
</main>
<div id="bar"><span id="now">Belum ada lagu diputar</span><progress id="prog" value="0" max="1"></progress></div>
<script>
const SONGS=[
["Kisah Kasih di Sekolah","Chrisye"],["Lilin-Lilin Kecil","James F. Sundah"],["Hampa Hatiku","Ebiet G. Ade"],
["Berita Kepada Kawan","Ebiet G. Ade"],["Kemesraan","Iwan Fals"],["Bento","Iwan Fals"],["Sore Tugu Pancoran","Iwan Fals"],
["Yang Terdalam","Peterpan"],["Kangen","Dewa 19"],["Separuh Aku","NOAH"],["Cinta Satu Malam","Melinda"],
["Jangan Ada Dusta Di Antara Kita","Titiek Puspa"],["Bimbang","Melly Goeslaw"],["Andai Ku Tahu","Ungu"],
["Sempurna","Andra and The Backbone"],["Pergilah Kasih","Chrisye"],["Aku Cinta Dia","Chrisye"],["Kuta Bali","Rano Karno"],
["Tak Gendong","Mbah Surip"],["Mengapa Kau Datang Lagi","Bob Tutupoli"],["Rindu","Nike Ardilla"],["Seberkas Sinar","Nike Ardilla"],
["Kupu-Kupu Malam","Peterpan"],["Mimpi","Anggun C. Sasmi"],["Pelangi di Matamu","Jamrud"],["Ayat-Ayat Cinta","Rossa"],
["Dealova","Once"],["Tentang Seseorang","Sheila on 7"],["Dan","Sheila on 7"],["Kamulah Satu-satunya","Dewa 19"]
].map(([title,artist],i)=>({id:i,title,artist}));
const list=document.getElementById('list'),q=document.getElementById('q'),now=document.getElementById('now'),prog=document.getElementById('prog');
const audio=new Audio();let cur=null;const cache={};
function render(){
  const k=q.value.toLowerCase();list.innerHTML='';
  SONGS.filter(s=>(s.title+s.artist).toLowerCase().includes(k)).forEach(s=>{
    const li=document.createElement('li');li.id='s'+s.id;if(cur===s.id)li.className='playing';
    const sp='https://open.spotify.com/search/'+encodeURIComponent(s.title+' '+s.artist);
    li.innerHTML=`<span class="no">${s.id+1}</span><div class="info"><div class="t"></div><div class="a"></div><a class="sp" target="_blank" rel="noopener" href="${sp}">Buka di Spotify</a></div><button class="play" aria-label="Putar">${cur===s.id&&!audio.paused?'⏸':'▶'}</button>`;
    li.querySelector('.t').textContent=s.title;li.querySelector('.a').textContent=s.artist;
    li.querySelector('.play').onclick=()=>toggle(s);list.appendChild(li);
  });
}
async function preview(s){
  if(cache[s.id]!==undefined)return cache[s.id];
  const r=await fetch('https://itunes.apple.com/search?media=music&limit=5&term='+encodeURIComponent(s.title+' '+s.artist));
  const d=await r.json();const hit=d.results.find(x=>x.previewUrl);
  return cache[s.id]=hit?hit.previewUrl:null;
}
async function toggle(s){
  if(cur===s.id){audio.paused?audio.play():audio.pause();return render();}
  cur=s.id;now.textContent='Memuat: '+s.title+'…';render();
  try{
    const url=await preview(s);
    if(!url){now.textContent='Cuplikan tidak tersedia — buka di Spotify';return;}
    audio.src=url;await audio.play();now.textContent='▶ '+s.title+' — '+s.artist;
  }catch(e){now.textContent='Gagal memutar. Coba lagi.';}
  render();
}
audio.ontimeupdate=()=>{prog.value=audio.currentTime/(audio.duration||1)};
audio.onpause=audio.onplay=render;
audio.onended=()=>{const n=SONGS[(cur+1)%SONGS.length];toggle(n)};
q.oninput=render;render();
</script>
</body>
</html>
